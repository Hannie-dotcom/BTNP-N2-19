<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Ngữ pháp N2 - Bài 19 (Shinkanzen)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background: linear-gradient(rgba(255, 245, 247, 0.55), rgba(240, 220, 225, 0.65)),
                        url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .sakura-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .petal {
            position: absolute;
            background: #ffb7c5;
            border-radius: 15px 0 15px 0;
            opacity: 0.75;
            filter: drop-shadow(0 2px 4px rgba(216, 90, 127, 0.2));
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translate(0, -10px) rotate(0deg); opacity: 0.8; }
            100% { transform: translate(120px, 105vh) rotate(360deg); opacity: 0; }
        }

        .app-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 600px;
            border-radius: 24px;
            padding: 32px 28px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(180, 100, 120, 0.15);
        }

        .lesson-title {
            font-size: 20px;
            font-weight: 700;
            color: #d85a7f;
            margin-bottom: 6px;
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            font-size: 14px; 
            font-weight: 700; 
            color: #b06d7e; 
            margin-bottom: 20px; 
            padding-bottom: 10px;
            border-bottom: 1.5px solid #f2d5db;
        }

        .question-card {
            background: #fff5f7;
            border-left: 4px solid #d85a7f;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .question-title {
            font-size: 14px;
            font-weight: 700;
            color: #d85a7f;
            margin-bottom: 8px;
        }

        .question-text { 
            font-size: 18px; 
            font-weight: 600; 
            color: #3a2e30; 
            line-height: 1.6;
        }

        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        
        .opt-btn {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1.5px solid #f2d5db;
            color: #4a383b;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .opt-btn::before {
            content: '';
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #b06d7e;
            border-radius: 50%;
            margin-right: 14px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .opt-btn:hover { 
            background: #fff0f3; 
            border-color: #d85a7f; 
            transform: translateY(-1px); 
        }

        .opt-btn.correct { 
            background: #e8f5e9 !important; 
            border-color: #66bb6a !important; 
            color: #2e7d32 !important; 
        }
        .opt-btn.correct::before {
            background: #4caf50;
            border-color: #4caf50;
            box-shadow: inset 0 0 0 3px #ffffff;
        }

        .opt-btn.wrong { 
            background: #ffebee !important; 
            border-color: #ef5350 !important; 
            color: #c62828 !important; 
        }
        .opt-btn.wrong::before {
            background: #ef5350;
            border-color: #ef5350;
            box-shadow: inset 0 0 0 3px #ffffff;
        }

        .feedback { 
            display: none;
            margin-top: 20px; 
            font-size: 15px; 
            text-align: left;
        }

        .result-status {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 12px;
            text-align: center;
        }

        .explain-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid #f2d5db;
            border-radius: 16px;
            padding: 16px;
            line-height: 1.6;
            color: #3a2e30;
        }

        .explain-item {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .explain-item:last-child { margin-bottom: 0; }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-right: 6px;
            color: white;
        }
        .tag-grammar { background: #e07a9e; }
        .tag-trans { background: #5c6bc0; }
        .tag-meaning { background: #26a69a; }

        .next-btn {
            display: block;
            width: 100%;
            margin-top: 16px;
            background: linear-gradient(135deg, #e07a9e 0%, #d85a7f 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .next-btn:hover { opacity: 0.95; transform: translateY(-1px); }
    </style>
</head>
<body>

    <div class="sakura-container" id="sakura-box"></div>

    <div class="app-card">
        <div class="lesson-title">Bài 19 - N2 (Shinkanzen Master)</div>

        <div class="header">
            <span id="q-count">Câu 1 / 22</span>
            <span id="score-count">Điểm: 0</span>
        </div>

        <div class="question-card">
            <div class="question-title" id="q-type">Câu 1: Chọn đáp án đúng</div>
            <div class="question-text" id="question-content"></div>
        </div>

        <div class="options-grid" id="quiz-box">
            <button class="opt-btn" onclick="checkAnswer(0)"></button>
            <button class="opt-btn" onclick="checkAnswer(1)"></button>
            <button class="opt-btn" onclick="checkAnswer(2)"></button>
        </div>

        <div class="feedback" id="feedback">
            <div class="result-status" id="result-status"></div>
            <div class="explain-card">
                <div class="explain-item"><span class="tag tag-grammar">Cấu trúc</span><span id="ex-grammar"></span></div>
                <div class="explain-item"><span class="tag tag-meaning">Ý nghĩa</span><span id="ex-meaning"></span></div>
                <div class="explain-item"><span class="tag tag-trans">Dịch câu</span><span id="ex-trans"></span></div>
            </div>
            <button class="next-btn" onclick="nextQuestion()">Câu tiếp theo ➔</button>
        </div>
    </div>

    <script>
        function createPetal() {
            const box = document.getElementById('sakura-box');
            const p = document.createElement('div');
            p.classList.add('petal');
            p.style.width = Math.random() * 8 + 8 + 'px';
            p.style.height = Math.random() * 10 + 10 + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = Math.random() * 4 + 6 + 's';
            box.appendChild(p);
            setTimeout(() => p.remove(), 10000);
        }
        setInterval(createPetal, 400);

        // Toàn bộ 22 câu bài tập Shinkanzen N2 - Bài 19 (Trang 88 - 89)
        const quizData = [
            // Mục 1: ～わりに（は）
            {
                q: 'この寺は ( ) わりには観光客が少ない。',
                options: ['有名', '有名な', '有名だ'],
                answer: 1,
                grammar: 'ナ形 な + わりに（は）',
                meaning: 'So với tiêu chuẩn chung thì... (Mang tính ngạc nhiên vì lệch tiêu chuẩn).',
                trans: 'Ngôi chùa này so với độ nổi tiếng thì lượng khách du lịch khá ít.'
            },
            {
                q: '( ) わりにいい成績が残せた。',
                options: ['3時間練習した', 'たくさん練習した', 'あまり練習しなかった'],
                answer: 2,
                grammar: 'V-た形 + わりに',
                meaning: 'So với mức độ thực hiện (không luyện tập mấy) thì kết quả lại tốt.',
                trans: 'So với việc không luyện tập mấy thì tôi đã đạt được thành tích khá tốt.'
            },
            {
                q: '期待したわりには ( )。',
                options: ['点数に満足できた', '点数は良くなかった', '点数は80点以上だった'],
                answer: 1,
                grammar: 'V-た形 + わりには + Đánh giá bất ngờ',
                meaning: 'Vế sau đưa ra nhận xét trái với mức độ kỳ vọng.',
                trans: 'So với sự kỳ vọng thì điểm số không được tốt cho lắm.'
            },
            {
                q: 'この事件は、新聞で騒がれたわりには ( )。',
                options: ['知らない人が多い', '知らない人がいた', 'わたしは知らなかった'],
                answer: 0,
                grammar: 'V-受身 + わりには + Đánh giá toàn thể',
                meaning: 'So với việc được báo chí xôn xao đưa tin thì nhiều người lại không biết.',
                trans: 'Vụ án này so với việc xôn xao trên báo chí thì lại có nhiều người không biết.'
            },
            // Mục 2: ～にしては
            {
                q: 'いつも派手な服を着ているさゆりさんにしては、( )。',
                options: ['服をたくさん持っている', '今日はすてきな服を着ている', '今日の服はシンプルだ'],
                answer: 2,
                grammar: 'N + にしては',
                meaning: 'Dù là / So với một đối tượng cụ thể N thì vế sau lại bất ngờ/khác thường ngày.',
                trans: 'So với một người lúc nào cũng mặc đồ sặc sỡ như Sayuri thì trang phục hôm nay lại đơn giản.'
            },
            {
                q: '彼女は今日初めてテニスをしたのだそうだ。初めてにしては、( )。',
                options: ['上手だ', 'うまくない', '今日の試合で勝った'],
                answer: 0,
                grammar: 'N + にしては + Nhận xét/Đánh giá',
                meaning: 'So với tiêu chuẩn của người lần đầu làm thì vế sau đánh giá là giỏi.',
                trans: 'Nghe nói hôm nay là lần đầu tiên cô ấy chơi tennis. So với lần đầu tiên thì chơi như vậy là giỏi đấy.'
            },
            {
                q: 'ジョンさんは試験に合格したにしては、( )。',
                options: ['大喜びしている', 'うれしくなさそうだ', '国へ帰ってしまった'],
                answer: 1,
                grammar: 'V-普通形 + にしては',
                meaning: 'Thực tế vẻ mặt không vui trái ngược với việc đã đỗ kỳ thi.',
                trans: 'Anh John dù đã đỗ kỳ thi nhưng trông có vẻ lại không được vui lắm.'
            },
            // Mục 3: ～だけ（のことは）ある
            {
                q: 'たくさん練習しただけあって、( )。',
                options: ['きっと素晴らしい発表だろう', '素晴らしい発表だった', '緊張はしなかった'],
                answer: 1,
                grammar: 'V-た形 + だけあって',
                meaning: 'Quả đúng là... (Đạt được kết quả tương xứng với nỗ lực/tiêu chuẩn cao).',
                trans: 'Quả đúng là do đã luyện tập nhiều, bài phát biểu thực sự rất tuyệt vời.'
            },
            {
                q: 'あの学校は町の中心から離れているだけあって、( )。',
                options: ['静かで環境がいい', '遠くて不便だ', '通うのに時間がかかる'],
                answer: 0,
                grammar: 'V-ている + だけあって + Đánh giá tốt',
                meaning: 'Vế sau luôn thể hiện sự đánh giá cao/khen ngợi.',
                trans: 'Ngôi trường đó quả đúng là cách xa trung tâm thị trấn nên yên tĩnh và môi trường rất tốt.'
            },
            {
                q: 'あの人は若いだけあって、( )。',
                options: ['きっと困難を乗り越えられる', '考え方が子供っぽい', '仕事を覚えるのが早い'],
                answer: 2,
                grammar: 'A-い + だけあって + Đánh giá cao điểm mạnh',
                meaning: 'Bản chất sức trẻ thể hiện qua ưu điểm tiếp thu nhanh.',
                trans: 'Người đó quả đúng là tuổi trẻ nên tiếp thu công việc rất nhanh.'
            },
            // Mục 4: ～として
            {
                q: 'わたしは ( ) として日本に来た。',
                options: ['留学生', '仕事', '観光'],
                answer: 0,
                grammar: 'N + として',
                meaning: 'Với tư cách / Với vai trò N.',
                trans: 'Tôi đã đến Nhật Bản với tư cách là du học sinh.'
            },
            {
                q: '新聞紙は ( ) として再利用されます。',
                options: ['ごみ', '資源', 'もったいない'],
                answer: 1,
                grammar: 'N + として',
                meaning: 'Được tái sử dụng với vai trò là tài nguyên.',
                trans: 'Giấy báo được tái sử dụng với vai trò là một nguồn tài nguyên.'
            },
            {
                q: '彼は才能ある建築家として ( )。',
                options: ['劇場の設計が専門だ', 'この劇場が代表作だ', '高く評価されている'],
                answer: 2,
                grammar: 'N + として + Đánh giá/Thái độ',
                meaning: 'Được đánh giá cao với tư cách là nhà kiến trúc sư tài năng.',
                trans: 'Anh ấy được đánh giá rất cao với tư cách là một kiến trúc sư tài năng.'
            },
            // Mục 5: ～にとって
            {
                q: '父にとって ( )。',
                options: ['仕事が好きだった', 'よく仕事を続けた', '仕事は人生そのものだった'],
                answer: 2,
                grammar: 'N + にとって + Quan điểm/Đánh giá',
                meaning: 'Đối với N thì... (Đưa ra nhận định/đánh giá từ góc nhìn cá nhân).',
                trans: 'Đối với bố tôi, công việc chính là bản thân cuộc sống của ông.'
            },
            {
                q: '君にとって ( )、考えたことはありますか。',
                options: ['何が大切か', '何を大切にしているか', '大切にしているものは何か'],
                answer: 0,
                grammar: 'N + にとって + Quan điểm quan trọng',
                meaning: 'Cái gì là quan trọng đối với bản thân.',
                trans: 'Đã bao giờ bạn suy nghĩ xem điều gì là quan trọng đối với bản thân mình chưa?'
            },
            // Mục 6: ～にしたら・～にすれば・～にしてみれば・～にしても
            {
                q: 'わたしはフルタイムで働きたいし、夫 ( )、そのほうが心強いだろう。',
                options: ['にしたら', 'にしても', 'にしては'],
                answer: 0,
                grammar: 'N (Chỉ người) + にしたら',
                meaning: 'Nếu đứng trên lập trường của N thì suy đoán cảm xúc vế sau.',
                trans: 'Tôi muốn làm việc toàn thời gian, và đứng trên lập trường của chồng tôi thì như vậy có lẽ cũng yên tâm hơn.'
            },
            {
                q: 'わたしは商品の売り込みの電話はすぐ切ってしまうが、営業マンにすれば ( )。',
                options: ['なるべく長く話したいだろう', '早く話を終わらせたいだろう', 'それはありがたいことだろう'],
                answer: 0,
                grammar: 'N + にすれば + Suy đoán cảm xúc đối phương',
                meaning: 'Đứng ở vị trí của nhân viên kinh doanh thì suy đoán họ muốn nói chuyện càng lâu càng tốt.',
                trans: 'Tôi thì hay dập máy ngay với những cuộc gọi chào hàng, nhưng đứng trên lập trường của nhân viên kinh doanh thì chắc họ muốn nói chuyện càng lâu càng tốt.'
            },
            // Mục 1~6: Bài tập tổng hợp
            {
                q: 'ここは幼稚園 ( )、にぎやかな子供の声が聞こえない。',
                options: ['のわりには', 'にしては', 'だけあって'],
                answer: 0,
                grammar: 'N の + わりに（は）',
                meaning: 'So với tiêu chuẩn thông thường của một trường mầm non thì lại không nghe thấy tiếng trẻ con ríu rít.',
                trans: 'Ở đây so với một trường mầm non thì lại không nghe thấy tiếng trẻ con ồn ào náo nhiệt.'
            },
            {
                q: '実験の回数 ( ) 正確なデータは得られなかった。',
                options: ['にしたら', 'にとって', 'のわりに'],
                answer: 2,
                grammar: 'N の + わりに（は）',
                meaning: 'So với số lần thực hiện thí nghiệm nhiều thì lại không thu được dữ liệu chính xác.',
                trans: 'So với số lần thực nghiệm thì lại không thu thập được dữ liệu chính xác.'
            },
            {
                q: '子供のころのわたし ( ) 親は神様だった。',
                options: ['としては', 'にしては', 'にとっては'],
                answer: 2,
                grammar: 'N + にとっては',
                meaning: 'Đối với bản thân tôi hồi còn nhỏ thì cha mẹ là thần thần tượng/thượng đế.',
                trans: 'Đối với tôi hồi còn nhỏ, cha mẹ giống như những vị thần.'
            },
            {
                q: '勉強時間 ( ) 成績は上がらなかった。',
                options: ['のわりには', 'にしては', 'だけあって'],
                answer: 0,
                grammar: 'N の + わりに（は）',
                meaning: 'So với thời gian học tập thì thành tích lại không tăng lên.',
                trans: 'So với thời gian học tập thì điểm số/thành tích lại không tăng lên.'
            },
            {
                q: 'この町はしょうゆの産地 ( ) 有名である。',
                options: ['にとっても', 'として', 'にしたら'],
                answer: 1,
                grammar: 'N + として',
                meaning: 'Nổi tiếng với tư cách / danh nghĩa là nơi sản xuất xì dầu.',
                trans: 'Thị trấn này nổi tiếng với danh nghĩa là nơi sản xuất xì dầu.'
            }
        ];

        let current = 0, score = 0, canClick = true;

        function init() {
            const item = quizData[current];
            document.getElementById('q-count').innerText = `Câu ${current + 1} / ${quizData.length}`;
            document.getElementById('score-count').innerText = `Điểm: ${score}`;
            document.getElementById('q-type').innerText = `Câu ${current + 1}: Chọn đáp án đúng`;
            document.getElementById('question-content').innerText = item.q;
            document.getElementById('feedback').style.display = 'none';
            canClick = true;

            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach((btn, i) => {
                btn.innerText = item.options[i];
                btn.className = 'opt-btn';
            });
        }

        function checkAnswer(selectedIndex) {
            if(!canClick) return; 
            canClick = false;

            const item = quizData[current];
            const btns = document.querySelectorAll('.opt-btn');
            const statusEl = document.getElementById('result-status');

            if(selectedIndex === item.answer) {
                btns[selectedIndex].classList.add('correct'); 
                score += 10;
                statusEl.innerHTML = `<span style="color: #4caf50;">✓ 正解 (Chính xác!)</span>`;
            } else {
                btns[selectedIndex].classList.add('wrong');
                btns[item.answer].classList.add('correct');
                statusEl.innerHTML = `<span style="color: #ef5350;">✕ ざんねん (Đáp án đúng là: ${item.options[item.answer]})</span>`;
            }

            document.getElementById('ex-grammar').innerText = item.grammar;
            document.getElementById('ex-meaning').innerText = item.meaning;
            document.getElementById('ex-trans').innerText = item.trans;

            document.getElementById('feedback').style.display = 'block';
        }

        function nextQuestion() {
            current = (current + 1) % quizData.length;
            init();
        }

        init();
    </script>
</body>
</html>
